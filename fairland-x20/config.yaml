name: "Fairland X20"
description: "Fairland X20 Pool Heat Pump integration via Modbus TCP and MQTT Discovery"
version: "0.9.1"
slug: "fairland_x20"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
url: "https://github.com/uk05de/ha-fairland-x20"
startup: services
init: false
homeassistant_api: true
services:
  - mqtt:need
options:
  modbus_host: "192.168.1.1"
  modbus_port: 502
  modbus_slave: 1
  scan_interval: 30
  message_delay_ms: 200
  mqtt_host: "192.168.1.100"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  fallback_temp_topic: "bayrol_cl_ph/sensor/temperature/state"
  pool_status_entity: "sensor.pool_pumpe_status"
  pool_mode_entity: "sensor.pool_pumpe_mode"
  pool_next_transition_entity: "sensor.pool_pumpe_nachster_wechsel"
  pool_allowed_modes:
    - "Automatik"
  auto_heat_prerun_seconds: 60
  auto_heat_postrun_seconds: 180
  auto_heat_hvac_mode: "heat"
  loglevel: "INFO"
schema:
  modbus_host: str
  modbus_port: int
  modbus_slave: int
  scan_interval: int
  message_delay_ms: int
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: str
  fallback_temp_topic: str?
  pool_status_entity: str?
  pool_mode_entity: str?
  pool_next_transition_entity: str?
  pool_allowed_modes:
    - str
  auto_heat_prerun_seconds: int
  auto_heat_postrun_seconds: int
  auto_heat_hvac_mode: list(heat|auto)
  loglevel: list(INFO|DEBUG|ERROR)
